name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: http://localhost:8080/graphql
  NEON_AUTH_BASE_URL: https://ci.invalid
  NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-at-least-32-characters

# Production deployment is intentionally absent while auth-v2 task A00 contains
# the legacy Vercel/Fly topology. D-023/A11 must select and verify a replacement.

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: quorum_test
          POSTGRES_USER: quorum_operator
          POSTGRES_PASSWORD: quorum-ci-operator-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorum_operator -d quorum_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --max-archive-depth=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Docker build context exclusions
        run: npm run test:docker-context

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Test API
        working-directory: apps/api
        run: go test ./...
      - name: Verify generated SQLc artifacts
        run: |
          npm run db:generate
          git diff --exit-code -- apps/api/internal/db

      - name: Prove idempotent role bootstrap
        working-directory: apps/api
        env:
          OPERATOR_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
          QUORUM_MIGRATOR_PASSWORD: ci-migrator-password-not-for-production
          QUORUM_AUTH_RUNTIME_PASSWORD: ci-auth-password-not-for-production
          QUORUM_APP_RUNTIME_PASSWORD: ci-app-password-not-for-production
        run: |
          go run ./cmd/bootstrap-roles
          go run ./cmd/bootstrap-roles

      - name: Apply canonical migrations
        working-directory: apps/api
        env:
          MIGRATOR_DATABASE_URL: postgres://quorum_migrator:ci-migrator-password-not-for-production@127.0.0.1:5432/quorum_test?sslmode=disable
        run: go run ./cmd/migrate

      - name: Initialize guarded local database identity
        working-directory: apps/api
        env:
          LOCAL_TEST_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
        run: go run ./cmd/localdb init

      - name: Prove guarded local reset and canonical replay
        working-directory: apps/api
        env:
          LOCAL_TEST_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
          QUORUM_ALLOW_LOCAL_RESET: "true"
        run: go run ./cmd/localdb reset


      - name: Test API with required database integration
        working-directory: apps/api
        env:
          QUORUM_REQUIRE_INTEGRATION: "true"
          QUORUM_TEST_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
          QUORUM_MIGRATION_TEST_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
          QUORUM_ROLE_TEST_DATABASE_URL: postgres://quorum_operator:quorum-ci-operator-only@127.0.0.1:5432/quorum_test?sslmode=disable
          QUORUM_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: go test ./...

      - name: Test web units and components
        run: npm run test:web

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test public browser shell
        run: npm run test:e2e

      - name: Verify Mailpit readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8025/readyz

name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: http://localhost:8080/graphql
  NEON_AUTH_BASE_URL: https://ci.invalid
  NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-at-least-32-characters

# Production deployment is intentionally absent while auth-v2 task A00 contains
# the legacy Vercel/Fly topology. D-023/A11 must select and verify a replacement.

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install Node dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Test API
        working-directory: apps/api
        run: go test ./...

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      QUORUM_TEST_DATABASE_URL: ${{ secrets.QUORUM_TEST_DATABASE_URL }}
      NEON_AUTH_ISSUER: ${{ secrets.NEON_AUTH_ISSUER }}
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}
      NEON_AUTH_AUDIENCE: ${{ secrets.NEON_AUTH_AUDIENCE }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN || 'http://localhost:3000' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Skip smoke when secrets are missing
        if: env.QUORUM_TEST_DATABASE_URL == '' || env.NEON_AUTH_ISSUER == '' || env.NEON_AUTH_JWKS_URL == ''
        run: echo "::notice::Smoke checks skipped because dedicated test database or Neon Auth secrets are not configured."

      - name: Checkout
        if: env.QUORUM_TEST_DATABASE_URL != '' && env.NEON_AUTH_ISSUER != '' && env.NEON_AUTH_JWKS_URL != ''
        uses: actions/checkout@v4

      - name: Setup Go
        if: env.QUORUM_TEST_DATABASE_URL != '' && env.NEON_AUTH_ISSUER != '' && env.NEON_AUTH_JWKS_URL != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API migrations against test database
        if: env.QUORUM_TEST_DATABASE_URL != '' && env.NEON_AUTH_ISSUER != '' && env.NEON_AUTH_JWKS_URL != ''
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.QUORUM_TEST_DATABASE_URL }}
        run: go run ./cmd/migrate

      - name: Run API smoke flow
        if: env.QUORUM_TEST_DATABASE_URL != '' && env.NEON_AUTH_ISSUER != '' && env.NEON_AUTH_JWKS_URL != ''
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.QUORUM_TEST_DATABASE_URL }}
        run: go run ./cmd/e2e -run-id ci-${{ github.run_id }}-${{ github.run_attempt }}

name: quorum-production

# One host behind an external HTTPS reverse proxy. Only Next binds a host port;
# Go is reachable solely through the restrictive shared Unix-domain socket.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    environment:
      APP_ENV: production
      INTERNAL_API_SOCKET_PATH: /run/quorum/api.sock
    volumes:
      - quorum-internal-socket:/run/quorum
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      INTERNAL_API_SOCKET_PATH: /run/quorum/api.sock
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - quorum-internal-socket:/run/quorum
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  quorum-internal-socket:

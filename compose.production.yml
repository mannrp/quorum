name: quorum-production

# One host behind an external HTTPS reverse proxy. Only Next binds a host port;
# Go is reachable solely through the restrictive shared Unix-domain socket.
services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/usr/local/bin/quorum-migrate"]
    env_file: .env.production.migrate
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production.api
    environment:
      APP_ENV: production
      INTERNAL_API_SOCKET_PATH: /run/quorum/api.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - quorum-internal-socket:/run/quorum
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.production.web
    environment:
      NODE_ENV: production
      INTERNAL_API_SOCKET_PATH: /run/quorum/api.sock
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - quorum-internal-socket:/run/quorum:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  quorum-internal-socket:
